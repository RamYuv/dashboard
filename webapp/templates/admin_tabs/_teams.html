<div class="row g-3">
    <div class="col-12">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-2">
            <h1 class="admin-section-heading mb-0">{{ tab_titles.get(active_tab, "Team Management") }}</h1>
            <button class="btn btn-success" type="button" data-bs-toggle="modal" data-bs-target="#addTeamModal" data-admin-modal-trigger data-admin-form="#addTeamForm" data-admin-action="create" data-admin-title="#addTeamModalLabel" data-admin-title-text="Add Team" data-admin-submit="#addTeamSubmit" data-admin-submit-text="Save Team" data-admin-values='{"team_id":"","team_name":"","description":""}'>
                <i class="fas fa-plus me-2"></i>Add New
            </button>
        </div>
    </div>

    <div class="col-12">
        <div class="card shadow-sm border-0 admin-panel">
            <div class="card-body">
                <div class="table-responsive admin-table-wrap">
                    <table class="table align-middle">
                        <thead><tr><th>Team</th><th>Description</th><th>Created</th><th class="admin-action-cell">Actions</th></tr></thead>
                        <tbody>
                        {% for team in teams %}
                            <tr>
                                <td>{{ team.team_name|upper }}</td>
                                <td>{{ team.description or "-" }}</td>
                                <td>{{ team.created_at or "-" }}</td>
                                <td class="admin-action-cell">
                                    <div class="admin-row-actions">
                                        <button class="btn btn-outline-primary admin-icon-btn" type="button" data-bs-toggle="modal" data-bs-target="#addTeamModal" data-admin-modal-trigger data-admin-form="#addTeamForm" data-admin-action="update_team" data-admin-title="#addTeamModalLabel" data-admin-title-text="Edit Team" data-admin-submit="#addTeamSubmit" data-admin-submit-text="Update Team" data-admin-values='{{ {"team_id": team.team_id, "team_name": team.team_name, "description": team.description or ""}|tojson }}' aria-label="Edit team">
                                            <i class="fas fa-pen"></i>
                                        </button>
                                        <form method="post" class="d-inline">
                                            <input type="hidden" name="action" value="delete_team">
                                            <input type="hidden" name="entity" value="teams">
                                            <input type="hidden" name="tab" value="teams">
                                            <input type="hidden" name="team_id" value="{{ team.team_id }}">
                                            <button class="btn btn-outline-danger admin-icon-btn" type="submit" aria-label="Delete team">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        {% else %}
                            <tr><td colspan="4" class="text-muted">No teams found.</td></tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade admin-add-modal" id="addTeamModal" tabindex="-1" aria-labelledby="addTeamModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content admin-panel border-0">
            <div class="modal-header">
                <h3 class="modal-title h5 mb-0" id="addTeamModalLabel">Add Team</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="post" id="addTeamForm">
                    <input type="hidden" name="action" value="create">
                    <input type="hidden" name="entity" value="teams">
                    <input type="hidden" name="tab" value="teams">
                    <input type="hidden" name="team_id" value="">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="team_name">Team Name</label>
                            <input class="form-control" id="team_name" name="team_name" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="team_description">Description</label>
                            <textarea class="form-control" id="team_description" name="description" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="addTeamForm" class="btn btn-primary" id="addTeamSubmit">Save Team</button>
            </div>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-12">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-2">
            <h1 class="admin-section-heading mb-0">{{ tab_titles.get(active_tab, "Role Management") }}</h1>
            <button class="btn btn-success" type="button" data-bs-toggle="modal" data-bs-target="#addRoleModal" data-admin-modal-trigger data-admin-form="#addRoleForm" data-admin-action="create" data-admin-title="#addRoleModalLabel" data-admin-title-text="Add Role" data-admin-submit="#addRoleSubmit" data-admin-submit-text="Save Role" data-admin-values='{"original_role_name":"","role_name":"","description":"","is_active":true}'>
                <i class="fas fa-plus me-2"></i>Add New
            </button>
        </div>
    </div>

    <div class="col-12">
        <div class="card shadow-sm border-0 admin-panel">
            <div class="card-body">
                <div class="table-responsive admin-table-wrap">
                    <table class="table align-middle">
                        <thead><tr><th>Role</th><th>Description</th><th>Active</th><th>Created</th><th class="admin-action-cell">Actions</th></tr></thead>
                        <tbody>
                        {% for role in roles %}
                            <tr>
                                <td>{{ role.role_name }}</td>
                                <td>{{ role.description or "-" }}</td>
                                <td>{{ "Yes" if role.is_active else "No" }}</td>
                                <td>{{ role.created_at or "-" }}</td>
                                <td class="admin-action-cell">
                                    <div class="admin-row-actions">
                                        <button class="btn btn-outline-primary admin-icon-btn" type="button" data-bs-toggle="modal" data-bs-target="#addRoleModal" data-admin-modal-trigger data-admin-form="#addRoleForm" data-admin-action="update_role_record" data-admin-title="#addRoleModalLabel" data-admin-title-text="Edit Role" data-admin-submit="#addRoleSubmit" data-admin-submit-text="Update Role" data-admin-values='{{ {"original_role_name": role.role_name, "role_name": role.role_name, "description": role.description or "", "is_active": role.is_active}|tojson }}' aria-label="Edit role">
                                            <i class="fas fa-pen"></i>
                                        </button>
                                        <form method="post" class="d-inline">
                                            <input type="hidden" name="action" value="delete_role_record">
                                            <input type="hidden" name="entity" value="roles">
                                            <input type="hidden" name="tab" value="roles">
                                            <input type="hidden" name="original_role_name" value="{{ role.role_name }}">
                                            <button class="btn btn-outline-danger admin-icon-btn" type="submit" aria-label="Delete role">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        {% else %}
                            <tr><td colspan="5" class="text-muted">No roles found.</td></tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade admin-add-modal" id="addRoleModal" tabindex="-1" aria-labelledby="addRoleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content admin-panel border-0">
            <div class="modal-header">
                <h3 class="modal-title h5 mb-0" id="addRoleModalLabel">Add Role</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="post" id="addRoleForm">
                    <input type="hidden" name="action" value="create">
                    <input type="hidden" name="entity" value="roles">
                    <input type="hidden" name="tab" value="roles">
                    <input type="hidden" name="original_role_name" value="">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="role_name">Role Name</label>
                            <input class="form-control" id="role_name" name="role_name" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="role_description">Description</label>
                            <textarea class="form-control" id="role_description" name="description" rows="3"></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="role_active" name="is_active" checked>
                                <label class="form-check-label" for="role_active">Enable role</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="addRoleForm" class="btn btn-primary" id="addRoleSubmit">Save Role</button>
            </div>
        </div>
    </div>
</div>

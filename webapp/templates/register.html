{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-2">Register</h1>
                <p class="text-muted mb-4">Create your local account and choose a team/role for access control.</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="confirm_password">Confirm Password</label>
                            <input class="form-control" id="confirm_password" name="confirm_password" type="password" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label" for="role">Role</label>
                            <select class="form-select" id="role" name="role">
                                <option value="user">User</option>
                                <option value="qa">QA</option>
                                <option value="manager">Manager</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label" for="team">Team</label>
                            <select class="form-select" id="team" name="team">
                                <option value="env">ENV</option>
                                <option value="qa">QA</option>
                                <option value="support">Support</option>
                                <option value="alpha">Alpha</option>
                                <option value="beta">Beta</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Create account</button>
                </form>
                <p class="mt-4 mb-0 text-center">Already registered? <a href="{{ url_for('main.login') }}">Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block main_class %}container-fluid px-3 px-lg-4 pt-3 pb-4{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6 col-xl-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">Change Password</h1>
                <p class="text-muted mb-4">Update your account password.</p>

                <form method="post">
                    <div class="mb-3">
                        <label class="form-label" for="current_password">Current Password</label>
                        <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="new_password">New Password</label>
                        <input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="confirm_password">Confirm Password</label>
                        <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-save me-2"></i>Update Password
                        </button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('main.profile') }}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
